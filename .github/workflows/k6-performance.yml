name: NiteOut K6 Performance

# Manual run: enter total VUs only. They split round-robin across 3 venues
# (e.g. 600 → 200 per venue). Auth via GET /tests/token (secret K6_TEST_TOKEN_AUTH).
on:
  workflow_dispatch:
    inputs:
      vus:
        description: "Total concurrent users (split across 3 venues, e.g. 50 / 100 / 600)"
        required: true
        default: "50"

concurrency:
  group: niteout-k6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k6:
    name: ${{ inputs.vus }} concurrent users
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      K6_TEST_TOKEN_AUTH: ${{ secrets.K6_TEST_TOKEN_AUTH }}
      K6_BASE_URL: ${{ secrets.K6_BASE_URL }}
      K6_VENUE_IDS: ${{ secrets.K6_VENUE_IDS }}
      K6_EVENT_ID: ${{ secrets.K6_EVENT_ID }}
      K6_GROUP_ID: ${{ secrets.K6_GROUP_ID }}
      K6_CHAT_USER_UUID: ${{ secrets.K6_CHAT_USER_UUID }}
      K6_ENVIRONMENT: ci
      LOAD_GENERATOR: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${K6_TEST_TOKEN_AUTH:-}" ]]; then
            echo "::error::Add repo secret K6_TEST_TOKEN_AUTH"
            exit 1
          fi
          VUS="${{ inputs.vus }}"
          if ! [[ "$VUS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::vus must be a positive integer"
            exit 1
          fi
          if (( VUS > 100 )); then
            echo "::warning::VUS=${VUS} on ubuntu-latest may be generator-limited — check transport errors in the report."
          fi

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Prepare env
        shell: bash
        run: |
          set -euo pipefail

          cp .env.example .env
          sed -i '/^K6_TEST_TOKEN_AUTH=/d' .env

          export K6_BASE_URL="${K6_BASE_URL:-https://us-central1-niteout-c7d45.cloudfunctions.net/dev_api}"
          export K6_VENUE_IDS="${K6_VENUE_IDS:-2ec9b615-c3d6-4510-8c3c-4646a48b3f83,3155c272-76cd-483d-8f68-e52dfd66f33e,3552bfdf-ff05-4da7-a09b-b843d7e5bfe3}"

          {
            echo "K6_BASE_URL=${K6_BASE_URL}"
            echo "K6_VENUE_IDS=${K6_VENUE_IDS}"
            echo "K6_TEST_TOKEN_AUTH='${K6_TEST_TOKEN_AUTH}'"
            [[ -n "${K6_EVENT_ID:-}" ]] && echo "K6_EVENT_ID=${K6_EVENT_ID}"
            [[ -n "${K6_GROUP_ID:-}" ]] && echo "K6_GROUP_ID=${K6_GROUP_ID}"
            [[ -n "${K6_CHAT_USER_UUID:-}" ]] && echo "K6_CHAT_USER_UUID=${K6_CHAT_USER_UUID}"
          } >> .env

          VUS="${{ inputs.vus }}"

          # Fixed concurrent session model (same as local). Only VUS changes.
          if (( VUS == 1 )); then
            PROFILE=smoke
            DURATION=45s
            SESSION=15
          elif (( VUS >= 600 )); then
            PROFILE=ci
            DURATION=30m
            SESSION=120
          elif (( VUS >= 100 )); then
            PROFILE=ci
            DURATION=10m
            SESSION=60
          else
            PROFILE=ci
            DURATION=7m
            SESSION=60
          fi

          cat > ".env.${PROFILE}" <<EOF
          TEST_PROFILE=$([ "$PROFILE" = smoke ] && echo smoke || echo load)
          VUS=${VUS}
          TEST_DURATION=${DURATION}
          SESSION_SECONDS=${SESSION}
          HEARTBEAT_SECONDS=15
          HEARTBEAT_JITTER_SECONDS=2
          ENABLE_RUNTIME_WRITES=true
          RUN_RARE_MOBILE_WRITES_ONCE=false
          LOAD_GENERATOR=ci
          ALLOW_SHARED_WRITE_IDENTITY=true
          REPORT_HTML=true
          GRAFANA_OUTPUT=false
          EOF
          sed -i 's/^[[:space:]]*//' ".env.${PROFILE}"

          echo "PROFILE=${PROFILE}" >> "$GITHUB_ENV"
          echo "K6_VENUE_IDS=${K6_VENUE_IDS}" >> "$GITHUB_ENV"

          IFS=',' read -r -a venues <<< "${K6_VENUE_IDS}"
          n=${#venues[@]}
          per=$(( VUS / n ))
          {
            echo "## Run"
            echo "- **${VUS} concurrent users** → ~**${per} per venue** across ${n} venues"
            echo "- Duration \`${DURATION}\`, session ${SESSION}s, heartbeat 15s"
            echo "- Auth: GET /tests/token · writes: on"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run
        shell: bash
        run: ./scripts/run-final.sh "${PROFILE}"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niteout-k6-${{ inputs.vus }}vus-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
